<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-src 'none'" />
<title>잇다 빠른 실행</title>
<link rel="stylesheet" href="shared/styles.css" />
<style>
  html, body { background: transparent; margin: 0; overflow: hidden; height: 100%; }
  /* 카드는 내용만큼만 크고 아래 남는 공간은 투명(맥 Spotlight처럼). 그 빈 곳을 누르면 닫힘. */
  #sp-root { padding: 8px; height: 100%; box-sizing: border-box; }
  .sp-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    box-shadow: 0 18px 50px rgba(16,24,40,.28), 0 2px 8px rgba(16,24,40,.14);
    overflow: hidden; display: flex; flex-direction: column; max-height: 100%;
  }
  .sp-input-row { display: flex; align-items: center; gap: 10px; padding: 14px 18px; flex-shrink: 0; }
  .sp-input-row .sp-icon { flex-shrink: 0; color: var(--text-faint); display: flex; }
  #sp-input {
    flex: 1; border: none; outline: none; background: transparent;
    font-size: 19px; color: var(--text); font-family: inherit;
  }
  #sp-input::placeholder { color: var(--text-faint); }
  .sp-hint { font-size: 11px; color: var(--text-faint); flex-shrink: 0; white-space: nowrap; }
  #sp-results { flex: 1; overflow-y: auto; border-top: 1px solid var(--divider); padding: 6px; }
  body[data-mode="capture"] #sp-results { display: none; }
  .sp-section { padding: 8px 12px 3px; font-size: 10px; font-weight: 700; letter-spacing: .03em; text-transform: uppercase; color: var(--text-faint); }
  .sp-item {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; border-radius: 10px;
    cursor: pointer; color: var(--text); overflow: hidden;
  }
  .sp-item .sp-item-icon { flex-shrink: 0; width: 18px; text-align: center; font-size: 14px; }
  .sp-item .sp-item-text { min-width: 0; display: flex; flex-direction: column; gap: 1px; overflow: hidden; }
  .sp-item .sp-item-label { font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp-item .sp-item-sub { font-size: 11px; color: var(--text-faint); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .sp-item.active { background: var(--brand-soft); }
  .sp-item.active .sp-item-label { color: var(--brand); }
  .sp-empty { padding: 14px 16px; font-size: 12.5px; color: var(--text-faint); }
</style>
</head>
<body>
<div id="sp-root"></div>
<script type="module" src="spotlight.js"></script>
</body>
</html>
