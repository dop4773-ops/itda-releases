<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>잇다 — Itda</title>
<link rel="stylesheet" href="shared/styles.css" />
</head>
<body>
<div class="app-root">
  <header class="global-topbar">
    <div class="global-topbar-right">
      <button class="global-icon-btn" id="gt-themeBtn" title="다크모드 전환">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="gt-themeIcon"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
      <button class="global-icon-btn" id="gt-searchBtn" title="검색">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      </button>
      <div class="bell-wrap" id="gt-bellWrap">
        <button class="bell" id="gt-bellBtn" title="알림">
          <div class="dot" id="gt-bellDot" style="display:none;"></div>
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 01-3.46 0"/></svg>
        </button>
        <div class="notif-dropdown" id="gt-notifDropdown">
          <div class="notif-dropdown-head">알림</div>
          <div id="gt-notifList"><div class="empty">불러오는 중…</div></div>
        </div>
      </div>
      <div class="bell-wrap" id="gt-quickSettingsWrap">
        <button class="global-icon-btn global-profile-btn" id="gt-profileBtn" title="빠른 설정">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </button>
        <div class="notif-dropdown" id="gt-quickSettingsDropdown">
          <div class="notif-dropdown-head">빠른 설정</div>
          <div class="quick-settings-body">
            <div class="update-row">
              <div style="font-size:12.5px;color:var(--text);">🌙 다크 모드</div>
              <label class="switch"><input type="checkbox" id="qs-darkToggle" /><span class="switch-track"><span class="switch-thumb"></span></span></label>
            </div>
            <div class="update-row" style="margin-top:8px;">
              <div style="font-size:12.5px;color:var(--text);">🔔 일정 전 알림</div>
              <label class="switch"><input type="checkbox" id="qs-notifToggle" /><span class="switch-track"><span class="switch-thumb"></span></span></label>
            </div>
            <div class="update-row" style="margin-top:8px;">
              <div style="font-size:12.5px;color:var(--text);">🖥 위젯 항상 위</div>
              <label class="switch"><input type="checkbox" id="qs-widgetTopToggle" /><span class="switch-track"><span class="switch-thumb"></span></span></label>
            </div>
            <div class="update-row" style="margin-top:8px;">
              <div style="font-size:12.5px;color:var(--text);">🚀 Windows 시작</div>
              <label class="switch"><input type="checkbox" id="qs-autoLaunchToggle" /><span class="switch-track"><span class="switch-thumb"></span></span></label>
            </div>
          </div>
          <a href="#/settings" class="quick-settings-more" id="qs-moreLink">모든 설정 →</a>
        </div>
      </div>
    </div>
  </header>

  <div class="app">
    <nav class="sidebar" id="sidebar">
    <div class="logo-row">
      <a href="#/dashboard" class="logo" id="sb-logo" title="대시보드로 이동">
        <img class="logo-badge" src="../build/icons/app-icon.png" alt="잇다" />
        <div class="logo-text"><b>잇다</b><span>ITDA</span></div>
      </a>
      <button class="collapse-btn" id="collapseBtn" title="접기/펼치기">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
    </div>

    <ul class="nav">
      <li><a class="nav-item" href="#/dashboard" data-route="#/dashboard">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>
        <span class="label">대시보드</span>
      </a></li>
      <li><a class="nav-item tone-blue" href="#/inbox" data-route="#/inbox">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11L2 12v6a2 2 0 002 2h16a2 2 0 002-2v-6l-3.45-6.89A2 2 0 0016.76 4H7.24a2 2 0 00-1.79 1.11z"/></svg>
        <span class="label">Inbox</span>
      </a></li>
      <li><a class="nav-item tone-purple" href="#/todo" data-route="#/todo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
        <span class="label">Todo</span>
      </a></li>
      <li><a class="nav-item tone-green" href="#/calendar" data-route="#/calendar">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/></svg>
        <span class="label">일정</span>
      </a></li>
      <li><a class="nav-item tone-yellow" href="#/memo" data-route="#/memo">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M9 13h6M9 17h6"/></svg>
        <span class="label">메모</span>
      </a></li>
      <li><a class="nav-item tone-pink" href="#/postit" data-route="#/postit">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M8 3v6l3-2 3 2V3"/></svg>
        <span class="label">포스트잇</span>
      </a></li>
      <li><a class="nav-item tone-blue" href="#/search" data-route="#/search">
        <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span class="label">검색</span>
      </a></li>
    </ul>

    <div class="nav-section">
      <div class="nav-divider"></div>
      <ul class="nav">
        <li><a class="nav-item" href="#/settings" data-route="#/settings">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span class="label">설정</span>
        </a></li>
        <li><a class="nav-item tone-danger" href="#/trash" data-route="#/trash">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6h14z"/></svg>
          <span class="label">휴지통</span>
        </a></li>
      </ul>
      <div class="profile">
        <div class="avatar"><div class="presence-dot"></div></div>
        <div class="profile-info">
          <b id="sb-userName">홍길동</b>
          <span class="status">🟢 작업중</span>
        </div>
      </div>
    </div>
  </nav>

  <main id="view-root" class="main"></main>
</div>
</div>

<!-- 전역 빠른 입력: 어느 화면에서든 Cmd/Ctrl+K 로 Inbox에 바로 저장 -->
<div class="fab-hint" id="fabHint">⌘K 로 어디서든 빠른 입력</div>
<button class="fab" id="fab" title="빠른 입력 (⌘K)">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.2"><path d="M12 5v14M5 12h14"/></svg>
</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="quick-modal">
    <input type="text" placeholder="무엇이든 입력하세요… (예: 김OO 재평가)" id="quickInput" />
    <div class="hint-row">
      <span>Inbox에 바로 저장됩니다 · 자동 분류 없음</span>
      <span><kbd>Esc</kbd> 닫기 · <kbd>Enter</kbd> 추가</span>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script type="module" src="shared/router.js"></script>
</body>
</html>
