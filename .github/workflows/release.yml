name: Windows 릴리스 빌드/배포

# main에 코드가 푸시될 때마다 Windows에서 수동으로 `npm run release:win`을 돌리던 걸
# 대신 해준다 — 맥에서 커밋/푸시만 하면 GitHub Releases에 새 버전이 자동으로 올라가고,
# 앱의 electron-updater(main/updater/index.js)가 그걸 그대로 감지한다.
on:
  push:
    branches: [main]
    paths:
      - 'main/**'
      - 'renderer/**'
      - 'preload.js'
      - 'schema/**'
      - 'package.json'
      - 'package-lock.json'
      - 'eslint.config.js'
      - '.github/workflows/**'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # 문법/참조 오류(no-undef, no-dupe-keys 등)로 "앱이 아예 안 뜨는" 빌드가 배포되는 걸 막는 게이트.
      # 에러가 하나라도 있으면 여기서 워크플로가 실패하고 릴리스가 안 올라간다.
      - run: npm run lint
      - run: npm run release:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      # electron-builder가 만드는 GitHub Release는 본문(notes)이 비어있어서, 앱의 "업데이트
      # 로그"(설정 > 업데이트)에 아무 내용도 안 보이는 문제가 있었다 — 이 저장소는 버전을 올린
      # 커밋 메시지 자체가 그 버전의 변경 내역이라, 그 메시지를 그대로 release notes로 채운다.
      - name: 릴리스 노트를 방금 커밋 메시지로 채우기
        shell: bash
        run: |
          VERSION=$(node -p "require('./package.json').version")
          git log -1 --format=%B | sed '/^Co-Authored-By/d' > release-notes.txt
          gh release edit "v$VERSION" --notes-file release-notes.txt
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
