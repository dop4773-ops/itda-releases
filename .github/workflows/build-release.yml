name: 빌드 및 릴리스

# v로 시작하는 태그를 올리면(예: v1.2.0) 자동으로 실행됨
# 사용법: git tag v1.2.0 && git push origin v1.2.0
on:
  push:
    tags:
      - 'v*'

# GitHub이 최근 기본 정책을 "읽기 전용"으로 바꿔서, 릴리스를 만들려면(=저장소에 쓰기)
# 이렇게 명시적으로 허용해줘야 함 - 이게 없으면 마지막 릴리스 생성 단계에서 403 에러 남
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: 코드 가져오기
        uses: actions/checkout@v4

      - name: Python 3.12 설치
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 태그 버전을 코드에 자동 반영 (v1.3.2 -> 1.3.2)
        # 사람이 커밋할 때마다 APP_VERSION/installer.iss 버전을 손으로 맞춰야 했는데,
        # 깜빡하고 안 맞춰서 "빌드는 됐는데 버전 표시가 안 맞는" 문제가 반복됐었음.
        # 이제 git 태그 이름을 그대로 정답으로 삼아서 빌드 직전에 자동으로 덮어쓴다 -
        # 태그와 실제 빌드된 exe의 버전이 항상 100% 일치하는 게 보장됨.
        # (백틱으로 따옴표 이스케이프하는 방식이 파싱 에러를 일으켜서, 그냥 문자열을
        # 이어붙이는 훨씬 단순한 방식으로 교체함)
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host "이번 빌드 버전: $version"

          $newAppVersionLine = 'APP_VERSION = "' + $version + '"'
          (Get-Content itda_review_app.py) -replace 'APP_VERSION = "[^"]*"', $newAppVersionLine | Set-Content itda_review_app.py

          $newIssVersionLine = '#define MyAppVersion "' + $version + '"'
          (Get-Content installer.iss) -replace '#define MyAppVersion "[^"]*"', $newIssVersionLine | Set-Content installer.iss

          Get-Content itda_review_app.py | Select-String "APP_VERSION ="
          Get-Content installer.iss | Select-String "MyAppVersion"
        shell: powershell

      - name: 의존 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install flask pywebview pyinstaller joblib scikit-learn pystray pillow
          pip install llama-cpp-python==0.3.34 --extra-index-url https://abetlen.github.io/llama-cpp-python/whl/cpu
        shell: powershell

      - name: Inno Setup 설치
        run: choco install innosetup -y
        shell: powershell

      - name: .exe 빌드
        run: powershell -ExecutionPolicy Bypass -File build_exe.ps1
        shell: powershell

      - name: 설치 프로그램(setup.exe) 빌드
        run: powershell -ExecutionPolicy Bypass -File build_installer.ps1
        shell: powershell

      - name: 릴리스 생성 + Itda_Setup.exe 첨부
        uses: softprops/action-gh-release@v2
        with:
          files: Output/Itda_Setup.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
