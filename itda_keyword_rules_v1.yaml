# ============================================================
# 잇다 (Itda) - 규칙 기반 Event Engine 키워드/패턴 사전 v1
# 생성 근거: IP Messenger 실제 로그 31,560건 (ipmsg.db) 분석
# 대상 테이블: msg_tbl.body
# ============================================================
#
# 사용 순서 (분류 우선순위, priority 낮은 숫자가 먼저 검사됨):
#   1) preprocessing 규칙 적용 (인용문 제거 등)
#   2) ignore -> notice -> calendar -> todo -> reference 순으로 매칭 시도
#   3) 끝까지 매칭 안 되면 ambiguous_ai로 넘겨서 2단계(ML)/3단계(LLM) 처리
#
# event_type 값은 assistant.db 저장 시 그대로 사용 (todo/calendar/notice/reference/ignore)

version: 1
generated_from: "IP Messenger ipmsg.db 실제 로그 31,560건"
generated_date: "2026-08-01"

# ------------------------------------------------------------
# 0. 전처리 규칙 (분류 전에 반드시 적용)
# ------------------------------------------------------------
preprocessing:
  - name: strip_quoted_lines
    description: "'>'로 시작하는 줄은 이전 메시지 인용문이므로 제거 (안 하면 중복/오분류 발생)"
    regex: '^>.*$'
    action: remove_line

  - name: strip_delayed_send_marker
    description: "(IPMsg Delayed Send: HH:MM) 같은 시스템 부가 텍스트 제거"
    regex: '（?\(?IPMsg Delayed Send:.*?\)）?'
    action: remove_match

  - name: normalize_whitespace
    description: "연속 개행/공백 정리 (CRLF -> LF, 다중 공백 축소)"
    action: normalize

  - name: strip_control_chars
    description: "제어문자(\\x0b 등) 제거 - 로그에서 확인됨"
    action: remove_control_chars

# ------------------------------------------------------------
# 1. IGNORE - 이벤트화 불필요 (인사/감사/단답)
# ------------------------------------------------------------
ignore:
  priority: 1
  description: "순수 인사, 감사, 단답형 응답만 있는 메시지"
  condition: "전처리 후 본문 전체가 아래 패턴에 매칭되고, 전체 길이가 20자 미만일 때만 적용"
  full_match_patterns:
    - '^(네+|넵+|넹+|예|넹넹|아네)[\s!~^ㅎㅋ]*$'
    - '^(감사합니다|감사해요|고맙습니다)[\s!~^]*$'
    - '^(알겠습니다|알겠어요|확인하였습니다)[\s!~^]*$'
    - '^(수고하십시오|수고하세요|수고하셨습니다)[\s!~^]*$'
    - '^(안녕하십니까|안녕하세요)[\s!~^]*$'   # 인사만 있고 뒤에 내용 없는 경우만
  observed_frequency_note: "감사합니다 550회, 알겠습니다 214회, 네네 91회 (샘플 3000건 기준) - 상당수가 순수 acknowledgment"
  caveat: "인사말 뒤에 실질 요청/정보가 이어지면 절대 ignore 처리하지 말 것 (예: '안녕하십니까 9병동입니다. 902 제갈연자님 외박 예정으로...' 는 calendar+todo)"

# ------------------------------------------------------------
# 2. NOTICE - 부서 전체/다수 대상 공지, 행정 안내
# ------------------------------------------------------------
notice:
  priority: 2
  description: "특정 환자 1인이 아닌 조직/부서 단위 공지사항"
  keywords:
    - "공지"
    - "안내드립니다"
    - "알려드립니다"
    - "협조해 주시"
    - "담당하게 되어"
  patterns:
    - regex: '(공지|안내).{0,10}(드립니다|합니다)'
  example: "8월1일부터 의료소모품 관리를 총무과 구매팀 황선영(내선 662)선생님이 담당하게 되어 알려드립니다. 8월 5일 청구서는 6층 총무과로 제출하시고..."
  observed_count: "공지 160회 (표본 전체)"

# ------------------------------------------------------------
# 3. CALENDAR - 날짜/시간이 명시된 예정 이벤트 (통보성, 행동요청 없음)
# ------------------------------------------------------------
calendar:
  priority: 3
  description: "환자 개인 단위 일정. 아래 subtype 키워드 + 날짜/시간 패턴이 함께 있어야 확정.
    단, todo 판정 규칙(행동요청 문구)에 걸리면 todo가 우선함."
  subtypes:
    외박_외출:
      keywords: ["외박", "외출"]
      observed_count: "외박 278회, 외출 457회"
      example: "안녕하십니까 5병동 간호사실입니다. 506 박세훈님 개인사정으로 7/31 3P~ 8/1 8P 까지 주치의 허락하 외박예정이라 연락드립니다."
    전동_전원:
      keywords: ["전동", "전원"]
      observed_count: "전동 115회, 전원 213회"
      example: "907호 장우석 환자 8월3일 오후 805호로 전동 갑니다."
      note: "전원(轉院/다른 병원 이동)과 전원(電源) 동음이의어 주의 - 문맥상 '~병원 전원', '~로 전원' 형태만 매칭"
    외진_검사:
      keywords: ["외진", "CT", "MRI", "X-ray", "방사선", "예약"]
      observed_count: "외진 1356회, 검사 1874회, CT 34회, MRI 4회, 예약 32회"
      example: "704 최두이 6/12(금) 오전 10시경 동부허병원 외진 예약되었습니다.(9시 출발 예정)"
    회의:
      keywords: ["회의", "미팅"]
      observed_count: "회의 133회, 미팅 2회"
      example: "오늘 4시30분에 3층 ADL실에서 회의 진행하도록 하겠습니다."
    퇴원:
      keywords: ["퇴원"]
      observed_count: "퇴원 1843회 (매우 빈번 - 병동 일상 공지성)"
  date_time_patterns:
    - regex: '\d{1,2}\s*(/|\.)\s*\d{1,2}'      # 8/1, 8.1
    - regex: '\d{1,2}\s*(시|:|A|P|AM|PM|am|pm)' # 10시, 3P, 8am
    - regex: '(오전|오후|금일|내일|모레|토요일|일요일)'
  classification_rule: "subtype 키워드 매칭 + date_time_patterns 중 최소 1개 매칭 시 calendar로 분류"

# ------------------------------------------------------------
# 4. TODO - 발신자가 수신자에게 특정 행동을 요구
# ------------------------------------------------------------
todo:
  priority: 4
  description: "행동요청 문구가 있으면 calendar/reference보다 우선 적용"
  keywords:
    - "부탁드립니다"
    - "요청드립니다"
    - "확인 부탁"
    - "제출"
    - "작성"
    - "증량"
    - "감량"
    - "재평가"
    - "HOLD"
    - "hold"
    - "오더 변경"
    - "스케줄 조정"
    - "전환 부탁"
  action_verb_patterns:
    - regex: '(해주세요|해주십시오|바랍니다|주시기 바랍니다|부탁드립니다)\s*[.!~]*$'
    - regex: '(부탁|요청|확인).{0,5}(드립니다|드려요|합니다)'
  observed_count: "부탁 7393회(최빈), 요청 571회, 제출 89회, 증량 206회, 감량 109회, 재평가 91회"
  example: "신상태님 언어치료 daily로 증량 요청 드립니다. 증량시 운동치료 1타임 감량하고, 인지치료때문에 비는타임은 SB(기구) 잡아주십시오."
  deadline_extraction_hint: "제출/보고류는 문장 내 날짜(금일/내일/모레/특정날짜)를 마감일로 추출"

# ------------------------------------------------------------
# 5. REFERENCE - 행동요청 없는 임상 관찰/보고 (기록 가치는 있음)
# ------------------------------------------------------------
reference:
  priority: 5
  description: "즉각 행동요청은 아니지만 환자 상태 변화 기록으로 남길 가치가 있는 보고"
  keywords:
    - "거부"
    - "fever"
    - "어지러"
    - "bed side"
  observed_count: "거부 407회, bed side 1006회, fever 14회, 어지러 41회"
  example: "915 김광열 환자 운동은 하고 연하치료 거부 합니다. BEDSIDE"
  caveat: "'낙상' 키워드는 실제 낙상 사고 보고와 QI 활동/회의 논의에 모두 등장 (오탐 다수 확인됨) - 규칙만으로 확정하지 말고 ambiguous_ai로 이관 권장"

# ------------------------------------------------------------
# 6. AMBIGUOUS_AI - 규칙 매칭 실패 시 2단계(ML)/3단계(LLM)로 이관
# ------------------------------------------------------------
ambiguous_ai:
  priority: 99
  description: "위 규칙에 명확히 매칭되지 않는 경우. 원 기획서 예시와 실제 로그에서 확인된 애매 케이스"
  examples:
    - "CT 끝나면 업체에 연락해주세요"
    - "원장님 오시면 시작하겠습니다"
    - "환자 상태 보고 결정하겠습니다"
    - "낙상" 키워드 포함 메시지 (QI 논의 vs 실제 사고 구분 필요)
    - "전동/전원" 키워드는 있으나 date_time_patterns 미매칭 (구두 표현으로 날짜 생략된 경우)

